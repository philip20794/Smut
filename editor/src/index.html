<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob: data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Smut – A5-Prototyp</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="screen">
      <header class="editor-header">
        <span class="title">Smut <span class="subtle" id="book-label">A5-Prototyp</span></span>
        <div class="header-actions">
          <button id="close-book" class="header-save book-only" type="button">Zur Bücherliste</button>
          <button id="save-button" class="header-save" type="button">Speichern</button>
          <div class="zoom-controls" role="group" aria-label="Zoom der Buchansicht">
            <button type="button" id="zoom-out" aria-label="Verkleinern">−</button>
            <output id="zoom-value" aria-live="polite">60 %</output>
            <button type="button" id="zoom-in" aria-label="Vergrößern">+</button>
          </div>
        </div>
      </header>
      <section class="editor-sheet" aria-label="Editierbare A5-Buchseite">
        <div id="canvas-editor"></div>
      </section>
      <div class="controls">
        <button id="recheck-button" type="button">Verbindung erneut prüfen</button>
        <button id="backup-button" type="button">Buch-Backup</button>
        <p id="editor-status" role="status" aria-live="polite">Editor wird vorbereitet …</p>
        <p id="bridge-status" role="status">Android-Verbindung wird geprüft …</p>
      </div>
    </main>
  </body>
</html>

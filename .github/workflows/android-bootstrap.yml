name: Smut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smut-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Editor – typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install locked dependencies
        working-directory: editor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript typecheck
        working-directory: editor
        run: npm run typecheck
      - name: Offline and bridge security lint
        working-directory: editor
        run: npm run lint
      - name: Node unit tests
        working-directory: editor
        run: npm test

  android:
    name: Android – Kotlin tests, lint, debug build
    needs: editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify pinned Gradle wrapper
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          chmod +x gradlew
          ./gradlew --version
      - name: Kotlin unit tests, Android lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify offline editor bundled in APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$apk" >/dev/null
          for resource in index.html style.css main.js bridge.js; do
            unzip -Z1 "$apk" | grep -Fx "assets/editor/$resource"
          done
          unzip -p "$apk" assets/editor/index.html | grep -F "connect-src 'none'"
      - name: Verify development package ID and no network permission
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='io.github.philip20794.smut.dev'"
          if "$aapt" dump permissions "$apk" | grep -F "android.permission.INTERNET"; then
            echo "Die Offline-App darf kein INTERNET-Recht anfordern." >&2
            exit 1
          fi
      - name: Store internal (unverified) build for downstream gate
        uses: actions/upload-artifact@v4
        with:
          name: smut-internal-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smut-android-check-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator:
    name: Emulator API 35 – offline WebView smoke
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify Gradle wrapper
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          chmod +x gradlew
      - name: Enable KVM for accelerated emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Offline Android instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p app/build/reports/emulator
            adb shell svc wifi disable
            adb shell svc data disable
            trap 'status=$?; adb logcat -d -v time > app/build/reports/emulator/logcat.txt || true; if [ "$status" -ne 0 ]; then adb shell screencap -p /sdcard/smut-f05-error.png || true; adb pull /sdcard/smut-f05-error.png app/build/reports/emulator/ || true; fi' EXIT
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Preserve instrumented test results and debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smut-f05-emulator-reports-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/reports/emulator/
          if-no-files-found: warn

  tested-apk:
    name: Publish tested development APK
    needs: [editor, android, emulator]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Retrieve exact APK from tested commit
        uses: actions/download-artifact@v4
        with:
          name: smut-internal-apk-${{ github.run_id }}
          path: verified-input
      - name: Fingerprint and stage APK
        run: |
          set -euo pipefail
          test -s verified-input/app-debug.apk
          mkdir -p verified-output
          cp verified-input/app-debug.apk "verified-output/smut-dev-${GITHUB_SHA}.apk"
          (
            cd verified-output
            sha256sum "smut-dev-${GITHUB_SHA}.apk" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Publish APK only after all checks and emulator smoke passed
        uses: actions/upload-artifact@v4
        with:
          name: smut-tested-dev-${{ github.sha }}
          path: verified-output/
          if-no-files-found: error
          retention-days: 30

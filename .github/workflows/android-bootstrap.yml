name: Smut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smut-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Editor – typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install locked dependencies
        working-directory: editor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript typecheck
        working-directory: editor
        run: npm run typecheck
      - name: Offline and bridge security lint
        working-directory: editor
        run: npm run lint
      - name: Node unit tests
        working-directory: editor
        run: npm test

  android:
    name: Android – Kotlin tests, lint, debug build
    needs: editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify pinned Gradle wrapper
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          chmod +x gradlew
          ./gradlew --version
      - name: Kotlin unit tests, Android lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify offline editor bundled in APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$apk" >/dev/null
          for resource in index.html style.css main.js bridge.js; do
            unzip -Z1 "$apk" | grep -Fx "assets/editor/$resource"
          done
          unzip -p "$apk" assets/editor/index.html | grep -F "connect-src 'none'"
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smut-android-check-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
